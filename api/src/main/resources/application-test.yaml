spring:
  datasource:
    url: jdbc:h2:mem:nestspend_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT configuration for test only
jwt:
  secret: nestspend-test-secret-key-must-be-at-least-32-chars
  expiration-ms: 3600000
