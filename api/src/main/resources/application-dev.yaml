# =============================================================================
# Configuration du profil DÉVELOPPEMENT (H2 in-memory)
# =============================================================================
# Base de données H2 en mémoire, détruite à chaque redémarrage.
# Le mode PostgreSQL est activé pour maximiser la compatibilité avec la prod.
# Le DevDataSeeder injecte des données de test au démarrage.
# =============================================================================

spring:
  datasource:
    # H2 in-memory avec émulation PostgreSQL pour une compatibilité maximale
    url: jdbc:h2:mem:nestspend;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # Flyway gère le schéma - validate vérifie que les entités correspondent
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    # Affichage SQL en développement pour le débogage
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Nettoyage autorisé en dev uniquement (permet de repartir de zéro)
    clean-disabled: false

  # Console H2 accessible via http://localhost:8080/h2
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        # Autorisation de la console H2 depuis Spring Security (voir SecurityConfig)
        web-allow-others: false

# JWT - clé de développement (jamais utilisée en production)
jwt:
  secret: nestspend-dev-secret-key-must-be-at-least-32-chars
  expiration-ms: 86400000

# Actuator - tout exposé en développement
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
