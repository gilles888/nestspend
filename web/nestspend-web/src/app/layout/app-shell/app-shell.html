<div class="flex h-screen bg-background">
  <!-- Desktop Sidebar -->
  <aside class="hidden lg:flex lg:flex-col lg:w-64 bg-surface border-r border-border">
    <app-sidebar />
  </aside>

  <!-- Mobile Drawer Overlay -->
  @if (isMobileMenuOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="closeMobileMenu()"
      (keydown.escape)="closeMobileMenu()"
      tabindex="0"
      role="button"
      aria-label="Close menu"
    ></div>
  }

  <!-- Mobile Drawer -->
  <aside
    class="fixed inset-y-0 left-0 z-50 w-64 bg-surface transform transition-transform duration-300 ease-in-out lg:hidden"
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.-translate-x-full]="!isMobileMenuOpen()"
  >
    <app-sidebar (navItemClicked)="closeMobileMenu()" />
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0">
    <app-topbar (menuToggle)="toggleMobileMenu()" />
    <main class="flex-1 overflow-auto p-4 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>
