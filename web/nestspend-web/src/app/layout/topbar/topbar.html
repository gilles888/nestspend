<header class="flex items-center justify-between h-16 px-4 lg:px-6 bg-surface/80 dark:bg-dark-surface/80 backdrop-blur-lg border-b border-border/50 dark:border-dark-border/50 sticky top-0 z-30">
  <!-- Mobile Menu Button -->
  <button
    class="lg:hidden flex items-center justify-center w-10 h-10 rounded-xl text-text-muted dark:text-dark-text-muted hover:bg-primary-soft dark:hover:bg-primary/20 hover:text-primary transition-all duration-200"
    (click)="onMenuToggle()"
    [attr.aria-label]="'common.toggleMenu' | translate"
  >
    <i class="pi pi-bars text-xl"></i>
  </button>

  <!-- Mobile Logo -->
  <div class="lg:hidden flex items-center gap-2">
    <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-primary-dark">
      <i class="pi pi-wallet text-white text-sm"></i>
    </div>
    <span class="text-lg font-bold bg-gradient-to-r from-primary to-primary-dark bg-clip-text text-transparent">NestSpend</span>
  </div>

  <!-- Desktop Welcome / Breadcrumb -->
  <div class="hidden lg:flex items-center gap-4">
    <div class="flex items-center gap-2 text-sm">
      <i class="pi pi-home text-text-muted dark:text-dark-text-muted"></i>
      <span class="text-text-muted dark:text-dark-text-muted">/</span>
      <span class="font-medium text-text-main dark:text-dark-text-main">{{ 'nav.dashboard' | translate }}</span>
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2">
    <!-- Search (Desktop) -->
    <div class="hidden md:flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl">
      <i class="pi pi-search text-text-muted dark:text-dark-text-muted text-sm"></i>
      <input 
        type="text" 
        [placeholder]="'common.search' | translate" 
        class="bg-transparent border-none outline-none text-sm w-40 placeholder:text-text-muted dark:placeholder:text-dark-text-muted text-text-main dark:text-dark-text-main"
      />
      <kbd class="hidden lg:inline-flex items-center px-2 py-0.5 text-xs text-text-muted dark:text-dark-text-muted bg-white dark:bg-slate-600 rounded border border-border dark:border-dark-border">⌘K</kbd>
    </div>

    <!-- Language Selector -->
    <div class="flex items-center gap-1">
      @for (lang of languages; track lang.code) {
        <button
          class="flex items-center justify-center px-2 py-1.5 rounded-lg text-sm font-medium transition-all duration-200"
          [class.bg-primary]="isCurrentLang(lang.code)"
          [class.text-white]="isCurrentLang(lang.code)"
          [class.text-text-muted]="!isCurrentLang(lang.code)"
          [class.dark:text-dark-text-muted]="!isCurrentLang(lang.code)"
          [class.hover:bg-primary-soft]="!isCurrentLang(lang.code)"
          [class.dark:hover:bg-primary/20]="!isCurrentLang(lang.code)"
          (click)="switchLanguage(lang.code)"
          [attr.aria-label]="'language.' + lang.code | translate"
        >
          {{ lang.label }}
        </button>
      }
    </div>

    <!-- Dark Mode Toggle -->
    <button
      class="flex items-center justify-center w-10 h-10 rounded-xl text-text-muted dark:text-dark-text-muted hover:bg-primary-soft dark:hover:bg-primary/20 hover:text-primary transition-all duration-200"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? ('theme.toggleLight' | translate) : ('theme.toggleDark' | translate)"
    >
      <i [class]="themeService.isDark() ? 'pi pi-sun text-lg' : 'pi pi-moon text-lg'"></i>
    </button>

    <!-- Notifications -->
    <button
      class="relative flex items-center justify-center w-10 h-10 rounded-xl text-text-muted dark:text-dark-text-muted hover:bg-primary-soft dark:hover:bg-primary/20 hover:text-primary transition-all duration-200"
      [attr.aria-label]="'common.notifications' | translate"
    >
      <i class="pi pi-bell text-lg"></i>
      <span class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full ring-2 ring-surface dark:ring-dark-surface"></span>
    </button>

    <!-- User Profile -->
    <div class="relative">
      <button
        class="flex items-center gap-2 p-1.5 pr-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-200"
        [attr.aria-label]="'common.profile' | translate"
        [attr.aria-expanded]="isUserMenuOpen()"
        aria-haspopup="true"
        (click)="toggleUserMenu()"
      >
        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-accent text-white text-sm font-semibold">
          {{ currentUser?.displayName?.charAt(0) || 'U' }}
        </div>
        <i 
          class="pi text-xs text-text-muted dark:text-dark-text-muted hidden sm:block transition-transform duration-200"
          [class.pi-chevron-down]="!isUserMenuOpen()"
          [class.pi-chevron-up]="isUserMenuOpen()"
        ></i>
      </button>

      <!-- Dropdown Menu -->
      @if (isUserMenuOpen()) {
        <div 
          class="absolute right-0 top-full mt-2 w-56 bg-surface dark:bg-dark-surface rounded-xl shadow-elevated dark:shadow-dark-elevated border border-border dark:border-dark-border overflow-hidden z-50"
          role="menu"
        >
          <!-- User Info -->
          <div class="px-4 py-3 border-b border-border dark:border-dark-border">
            <p class="text-sm font-semibold text-text-main dark:text-dark-text-main truncate">
              {{ currentUser?.displayName || 'User' }}
            </p>
            <p class="text-xs text-text-muted dark:text-dark-text-muted truncate">
              {{ currentUser?.role || '' }}
            </p>
          </div>

          <!-- Menu Items -->
          <div class="py-1">
            <button
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-main dark:text-dark-text-main hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
              role="menuitem"
            >
              <i class="pi pi-user text-text-muted dark:text-dark-text-muted"></i>
              <span>{{ 'common.profile' | translate }}</span>
            </button>
            <button
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-danger hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
              role="menuitem"
              (click)="onLogout()"
            >
              <i class="pi pi-sign-out"></i>
              <span>{{ 'common.logout' | translate }}</span>
            </button>
          </div>
        </div>

        <!-- Backdrop to close menu -->
        <div 
          class="fixed inset-0 z-40" 
          (click)="closeUserMenu()"
          (keydown.escape)="closeUserMenu()"
          tabindex="-1"
        ></div>
      }
    </div>
  </div>
</header>
