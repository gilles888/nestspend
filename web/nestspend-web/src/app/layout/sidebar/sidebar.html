<nav class="flex flex-col h-full bg-gradient-to-b from-surface to-slate-50 dark:from-dark-surface dark:to-slate-800">
  <!-- Logo Section -->
  <div class="p-6 border-b border-border/50 dark:border-dark-border/50">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-primary-dark shadow-elevated dark:shadow-dark-elevated">
        <i class="pi pi-wallet text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-primary to-primary-dark bg-clip-text text-transparent">NestSpend</h1>
        <p class="text-xs text-text-muted dark:text-dark-text-muted">{{ 'common.financeManager' | translate }}</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <div class="flex-1 px-4 py-6">
    <p class="px-4 mb-3 text-xs font-semibold uppercase tracking-wider text-text-muted/70 dark:text-dark-text-muted/70">{{ 'nav.menu' | translate }}</p>
    <ul class="space-y-1">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-primary text-white shadow-elevated dark:shadow-dark-elevated"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="group flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted dark:text-dark-text-muted font-medium hover:bg-primary-soft dark:hover:bg-primary/20 hover:text-primary transition-all duration-200"
            (click)="onNavItemClick()"
          >
            <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 group-hover:bg-primary-soft dark:group-hover:bg-primary/20 group-[.bg-primary]:bg-white/20 transition-colors">
              <i [class]="item.icon + ' text-base group-[.bg-primary]:text-white'"></i>
            </div>
            <span>{{ item.labelKey | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-border/50 dark:border-dark-border/50">
    <div class="flex items-center gap-3 p-3 rounded-xl bg-gradient-to-r from-primary-soft to-accent-soft dark:from-primary/20 dark:to-accent/20">
      <div class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-slate-700 shadow-card dark:shadow-dark-card">
        <i class="pi pi-user text-primary"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-text-main dark:text-dark-text-main truncate">{{ currentUser?.displayName || 'User' }}</p>
        <p class="text-xs text-text-muted dark:text-dark-text-muted truncate">{{ currentUser?.role || ('common.freePlan' | translate) }}</p>
      </div>
      <button 
        class="p-2 rounded-lg hover:bg-danger/20 transition-colors" 
        [attr.aria-label]="'common.logout' | translate"
        (click)="onLogout()"
      >
        <i class="pi pi-sign-out text-danger"></i>
      </button>
    </div>
  </div>
</nav>
