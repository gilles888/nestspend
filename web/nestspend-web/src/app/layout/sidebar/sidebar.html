<nav class="flex flex-col h-full">
  <div class="p-4 border-b border-border">
    <h1 class="text-xl font-bold text-primary">NestSpend</h1>
  </div>
  <ul class="flex-1 p-4 space-y-2">
    @for (item of navItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary-soft text-primary"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-primary-soft hover:text-primary transition-colors"
          (click)="onNavItemClick()"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
