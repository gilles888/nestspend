# =============================================================================
# Configuration Nginx - NestSpend Web
# =============================================================================
# Sert l'application Angular SPA et proxifie les appels API vers le backend.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour les assets statiques
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache des assets statiques compilés (hashed par Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy vers l'API Spring Boot
    # Le backend Spring Boot expose ses routes sous /api/ - on conserve le préfixe
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toutes les autres requêtes -> index.html (routing Angular côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
