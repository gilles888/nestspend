# =============================================================================
# Vhost Nginx systeme pour NestSpend - nestspend.gilmotech.be
# =============================================================================
# A copier dans /etc/nginx/sites-available/nestspend
# puis activer avec : sudo ln -s /etc/nginx/sites-available/nestspend /etc/nginx/sites-enabled/
#
# Certbot ajoutera automatiquement la section HTTPS (port 443) apres obtention
# du certificat Let's Encrypt via :
#   sudo certbot --nginx -d nestspend.gilmotech.be --non-interactive --agree-tos -m admin@gilmotech.be
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nestspend.gilmotech.be;

    # Taille max des uploads (imports de fichiers bancaires)
    client_max_body_size 50M;

    # Racine des fichiers statiques Angular
    root /home/claude-worker/nestspend/web/nestspend-web/dist/nestspend-web/browser;
    index index.html;

    # Desactive la divulgation de version Nginx dans les headers
    server_tokens off;

    # Compression Gzip pour JS, CSS, JSON, polices, SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # Headers de securite HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache des assets Angular (noms de fichiers avec hash = immuables 1 an)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Proxy vers le backend Spring Boot - routes /api/*
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts adaptes aux imports de fichiers bancaires volumineux
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Desactive le buffering pour les reponses streaming
        proxy_buffering off;
    }

    # Swagger UI / documentation OpenAPI (backend)
    location /swagger-ui/ {
        proxy_pass http://localhost:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://localhost:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Actuator Spring Boot (monitoring / health check)
    location /actuator/ {
        proxy_pass http://localhost:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular : toutes les routes inconnues retournent index.html
    # Permet le routing cote client (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactive les logs pour les requetes de routines
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
